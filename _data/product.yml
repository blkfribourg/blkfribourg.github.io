platform_order:
  - garmin_app
  - garmin_datafield
  - amazfit

platforms:
  garmin_app:
    name: Garmin App
    short: Standalone watch app
    explanation: "Open WheelDash directly from the Garmin app list. The watch connects to the EUC, decodes its data, manages alerts and records the ride."
    install_url: "https://apps.garmin.com/apps/363ecacc-1b86-4863-a13c-49453303e900?tid=1"
    install_label: Install Garmin App
    features:
      wheels: { state: available, label: "Begode, Extreme Bull, Leaperkim, NOSFET, KingSong, InMotion (limited)", note: "InMotion only from the V11 (V11, V11Y, V12, V13, V14), and not every reading can be shown. NOSFET support is untested." }
      telemetry: { state: available, label: Available }
      safety_alerts: { state: available, label: Available }
      audio_alerts: { state: available, label: Watch tones + vibration, note: "Exact alert output depends on watch capabilities." }
      engo: { state: available, label: Available }
      varia: { state: available, label: Available }
      offline_maps: { state: unavailable, label: Not available }
      navigation: { state: unavailable, label: Not available, note: "The standalone Garmin App focuses on telemetry, alerts and recording; it does not include a map or navigation view." }
      recording: { state: platform, label: Garmin Connect }
      portal: { state: not_applicable, label: Not used for Garmin rides }
      dashboards: { state: platform, label: Set layout + 4/6/8 fields, note: "Choose the centre value and the top arc on the main screen. The datafield-like view shows 4, 6 or 8 fields you pick." }
      presets: { state: unavailable, label: Not available }
      account: { state: available, label: None }
      battery: { state: available, label: "10 h+ on many watches", note: "Depends on the watch model." }
      languages: { state: platform, label: English }
  garmin_datafield:
    name: Garmin Datafield
    short: Inside a Garmin activity
    explanation: "Add WheelDash to a Garmin activity screen. The Datafield connects directly to the EUC while the Garmin activity handles recording, maps and navigation."
    install_url: "https://apps.garmin.com/en-US/developer/2f1a5cdb-e881-4674-b4e1-9e53fe61596b/apps"
    install_label: Find Garmin Datafield
    features:
      wheels: { state: platform, label: "Begode, Extreme Bull, Leaperkim, NOSFET, KingSong", note: "No InMotion support." }
      telemetry: { state: available, label: Direct BLE, note: "Current wheel choices are Begode/Gotway, Leaperkim/NOSFET and KingSong. Like all Garmin datafields, it refreshes once per second." }
      safety_alerts: { state: available, label: Visual warnings }
      audio_alerts: { state: available, label: Watch tones + vibration, note: "Exact alert output depends on watch capabilities." }
      engo: { state: available, label: Telemetry + navigation cues, note: "Can send EUC data and compatible Garmin activity navigation cues to ENGO glasses." }
      varia: { state: available, label: Available }
      offline_maps: { state: platform, label: Garmin's own maps, note: "On watches with Garmin maps, the host activity's map screens sit beside the WheelDash screen." }
      navigation: { state: platform, label: Garmin's own navigation, note: "Navigation is Garmin's native navigation in the host activity. WheelDash can forward compatible turn and destination fields to ENGO glasses." }
      recording: { state: platform, label: Garmin activity + EUC FIT fields, note: "The host activity records the ride; WheelDash contributes EUC record and session fields to the FIT file." }
      portal: { state: not_applicable, label: Not used for Garmin rides }
      dashboards: { state: platform, label: 6 or 8 configurable fields, note: "Choose the displayed metrics within the Datafield's fixed layout." }
      presets: { state: unavailable, label: Not available }
      account: { state: available, label: None }
      battery: { state: available, label: "10 h+ on many watches", note: "The lightest version. Depends on the watch model." }
      languages: { state: platform, label: English }
  amazfit:
    name: Amazfit
    short: Standalone app, most features
    explanation: "Open WheelDash from the watch's app list. The watch connects to the EUC, shows the dashboard you build, runs the alarms and records the ride, which you can upload to the Ride Portal afterwards."
    install_url: "/install_amazfit/"
    install_label: Install on Amazfit
    features:
      wheels: { state: available, label: "Begode, Extreme Bull, Leaperkim, NOSFET, KingSong, InMotion", note: "Most InMotion models, from the V5 to the V14, P6 and E20." }
      telemetry: { state: available, label: Available }
      safety_alerts: { state: available, label: Available }
      audio_alerts: { state: available, label: Watch sounds + vibration }
      engo: { state: available, label: Available }
      varia: { state: available, label: Available }
      offline_maps: { state: available, label: Preloaded on the watch, note: "Route and raster map data are transferred through the phone before the ride." }
      navigation: { state: region, label: "Europe, USA, Canada, European Russia and China", note: "WheelDash's own navigation, running in the app on the watch. Open to every WheelDash account." }
      recording: { state: available, label: On-watch recording }
      portal: { state: available, label: Upload through phone }
      dashboards: { state: available, label: Custom layouts }
      presets: { state: available, label: Up to 4 per wheel, note: "Switch wheel settings such as tiltback speed or pedal mode with a watch button. Available settings depend on the wheel." }
      account: { state: platform, label: "Only to upload rides or navigate", note: "Free WheelDash account, also used for cloud backup of settings." }
      battery: { state: available, label: "About 12 % per hour (Bip 6)", note: "Measured on a Bip 6: a 1 h 40 ride with ENGO glasses and a Varia radar used 20 % of the battery." }
      languages: { state: available, label: "6 languages", note: "English, French, German, Spanish, Russian and Simplified Chinese." }

garmin_latency_note: "Bluetooth responsiveness on Garmin can vary by watch model, firmware and how frequently the wheel sends data. Wheels with higher Bluetooth traffic may show more noticeable delay on some watches."
