platform_order:
  - garmin_app
  - garmin_datafield
  - amazfit

platforms:
  garmin_app:
    name: Garmin App
    short: Standalone watch app
    explanation: "Open WheelDash directly from the Garmin app list. The watch connects to the EUC, decodes its data, manages alerts and records the ride."
    install_url: "https://apps.garmin.com/apps/363ecacc-1b86-4863-a13c-49453303e900?tid=1"
    install_label: Install Garmin App
    features:
      telemetry: { state: available, label: Available }
      safety_alerts: { state: available, label: Available }
      audio_alerts: { state: available, label: Watch tones + vibration, note: "Exact alert output depends on watch capabilities." }
      engo: { state: available, label: Available }
      varia: { state: available, label: Available }
      offline_maps: { state: unavailable, label: Not available }
      navigation: { state: unavailable, label: Not available, note: "The standalone Garmin App focuses on telemetry, alerts and recording; it does not include a map or navigation view." }
      recording: { state: platform, label: Garmin Connect }
      portal: { state: not_applicable, label: Not used for Garmin rides }
      dashboards: { state: unavailable, label: Not available }
  garmin_datafield:
    name: Garmin Datafield
    short: Inside a Garmin activity
    explanation: "Add WheelDash to a Garmin activity screen. The Datafield connects directly to the EUC while the Garmin activity handles recording, maps and navigation."
    install_url: "https://apps.garmin.com/en-US/developer/2f1a5cdb-e881-4674-b4e1-9e53fe61596b/apps"
    install_label: Find Garmin Datafield
    features:
      telemetry: { state: available, label: Direct BLE, note: "Current wheel choices are Begode/Gotway, Leaperkim/NOSFET and KingSong." }
      safety_alerts: { state: available, label: Visual warnings }
      audio_alerts: { state: available, label: Watch tones + vibration, note: "Exact alert output depends on watch capabilities." }
      engo: { state: available, label: Telemetry + navigation cues, note: "Can send EUC data and compatible Garmin activity navigation cues to ENGO glasses." }
      varia: { state: available, label: Available }
      offline_maps: { state: platform, label: Garmin map screens, note: "The Datafield does not draw a map. Use the map screens supplied by a compatible Garmin activity and device." }
      navigation: { state: platform, label: Garmin activity navigation, note: "Navigation belongs to the host Garmin activity. WheelDash can read compatible turn and destination fields for ENGO glasses." }
      recording: { state: platform, label: Garmin activity + EUC FIT fields, note: "The host activity records the ride; WheelDash contributes EUC record and session fields to the FIT file." }
      portal: { state: not_applicable, label: Not used for Garmin rides }
      dashboards: { state: platform, label: 6 or 8 configurable fields, note: "Choose the displayed metrics within the Datafield's fixed layout." }
  amazfit:
    name: Amazfit
    short: Integrated WheelDash experience
    explanation: "Use custom dashboards, on-watch recording and WheelDash navigation with route and map data transferred to the watch before the ride."
    install_url: "/install_amazfit/"
    install_label: Install on Amazfit
    features:
      telemetry: { state: available, label: Available }
      safety_alerts: { state: available, label: Available }
      audio_alerts: { state: available, label: Watch sounds + vibration }
      engo: { state: available, label: Available }
      varia: { state: available, label: Available }
      offline_maps: { state: available, label: Preloaded on the watch, note: "Route and raster map data are transferred through the phone before the ride." }
      navigation: { state: region, label: France and USA only, note: "Route data is transferred to the watch before the ride. Coverage uses WheelDash-operated personal infrastructure and is limited to supported regions." }
      recording: { state: available, label: On-watch recording }
      portal: { state: available, label: Upload through phone }
      dashboards: { state: available, label: Custom layouts }

garmin_latency_note: "Bluetooth responsiveness on Garmin can vary by watch model, firmware and how frequently the wheel sends data. Wheels with higher Bluetooth traffic may show more noticeable delay on some watches."
